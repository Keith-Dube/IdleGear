name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gearshare
          POSTGRES_PASSWORD: gearshare_dev_password
          POSTGRES_DB: gearshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearshare -d gearshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gearshare:gearshare_dev_password@localhost:5432/gearshare?schema=public
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
